services:
  - name: faircredit-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: APP_BASIC_AUTH_USER
        sync: false
      - key: APP_BASIC_AUTH_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - name: faircredit-frontend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: APP_BASIC_AUTH_USER
        sync: false
      - key: APP_BASIC_AUTH_PASSWORD
        sync: false
